blueprint:
  name: Wall Switch
  description: Configure actions for a 4-button wall switch
  domain: automation
  input:
    # Button Entities Section
    button_entities:
      name: Button Entities
      icon: mdi:gesture-tap-button
      input:
        button_1_entity:
          name: Button 1 Entity
          description: Select button 1 entity
          selector:
            entity:
              filter:
                - domain: event

        button_2_entity:
          name: Button 2 Entity
          description: Select button 2 entity
          selector:
            entity:
              filter:
                - domain: event

        button_3_entity:
          name: Button 3 Entity
          description: Select button 3 entity
          selector:
            entity:
              filter:
                - domain: event

        button_4_entity:
          name: Button 4 Entity
          description: Select button 4 entity
          selector:
            entity:
              filter:
                - domain: event

    button_press_actions:
      name: Button Press Actions
      icon: mdi:gesture-tap
      input:
        button_1_action:
          name: Top Left Button Press
          description: Action to run when button 1 is pressed
          default: []
          selector:
            action: {}

        button_3_action:
          name: Top Right Button Press
          description: Action to run when button 3 is pressed
          default: []
          selector:
            action: {}

        button_2_action:
          name: Bottom Left Button Press
          description: Action to run when button 2 is pressed
          default: []
          selector:
            action: {}

        button_4_action:
          name: Bottom Right Button Press
          description: Action to run when button 4 is pressed
          default: []
          selector:
            action: {}

mode: queued
max: 10

trigger:
  - platform: event
    event_type: initial_press
    event_data:
      entity_id: !input button_1_entity
    id: button_1

  - platform: event
    event_type: initial_press
    event_data:
      entity_id: !input button_2_entity
    id: button_2

  - platform: event
    event_type: initial_press
    event_data:
      entity_id: !input button_3_entity
    id: button_3

  - platform: event
    event_type: initial_press
    event_data:
      entity_id: !input button_4_entity
    id: button_4

action:
  - service: logbook.log
    data:
      name: Wall Switch
      message: "Button {{ trigger.id }} pressed"

  - choose:
      - conditions:
          - condition: trigger
            id: button_1
        sequence: !input button_1_action

      - conditions:
          - condition: trigger
            id: button_2
        sequence: !input button_2_action

      - conditions:
          - condition: trigger
            id: button_3
        sequence: !input button_3_action

      - conditions:
          - condition: trigger
            id: button_4
        sequence: !input button_4_action
