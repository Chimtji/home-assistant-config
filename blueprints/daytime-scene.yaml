blueprint:
  name: Daytime Lighting Scene
  description: Turn on lights with dynamic kelvin from input_number.daylight_kelvin and set a daytime lighting boolean. Supports per-light brightness overrides and time-based brightness.
  domain: script
  input:
    lights:
      name: Lights
      icon: mdi:lightbulb-multiple
      input:
        target_lights:
          name: Target Lights
          description: The lights to control
          selector:
            entity:
              domain: light
              multiple: true
    general:
      name: General Settings
      icon: mdi:cog
      input:
        transition:
          name: Transition Time
          description: Transition time in seconds
          default: 1
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: "s"
        daytime_kelvin:
          name: Daytime Kelvin
          description: The kelvin value appropriate for the time of day
          selector:
            entity:
              domain: input_number
        room_brightness:
          name: Daytime Room Brightness
          description: The Daytime brightness for the room
          selector:
            entity:
              domain: input_number
        use_daytime_temp:
          name: Daytime Temperature Boolean
          description: The enabler for daytime temperature
          selector:
            entity:
              domain: input_boolean
        use_daytime_brightness:
          name: Daytime Brightness Boolean
          description: The enabler for daytime room brightness
          selector:
            entity:
              domain: input_boolean
    overrides:
      name: Overrides
      icon: mdi:pencil
      input:
        brightness_overrides:
          name: Brightness Overrides (Optional)
          description: |
            Per-light brightness overrides in YAML format. Example:
              light.dining_lamp_1: 70
              light.dining_lamp_3: 30
          default: {}
          selector:
            object:
    nightlight:
      name: Night Lights (Optional)
      description: Custom nightlights in case a different scene than above should be used.
      icon: mdi:weather-night
      input:
        nightlight_target_lights:
          name: Nightlight Target Lights
          description: The lights to control
          default: []
          selector:
            entity:
              domain: light
              multiple: true
        nightlight_brightness:
          name: Nightlight Brightness
          description: Brightness level during night (0-100%)
          default: 2
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"

variables:
  target_lights: !input target_lights
  nightlight_target_lights: !input nightlight_target_lights
  brightness_overrides: !input brightness_overrides
  room_brightness: !input room_brightness
  daytime_kelvin: !input daytime_kelvin
  transition_time: !input transition
  use_daytime_temp: !input use_daytime_temp
  use_daytime_brightness: !input use_daytime_brightness
  nightlight_brightness: !input nightlight_brightness
  is_night: "{{ is_state('binary_sensor.is_night', 'on') }}"
  use_nightlights: "{{ is_night and nightlight_target_lights | length > 0 }}"
  active_lights: >
    {% if use_nightlights %}
      {{ nightlight_target_lights }}
    {% else %}
      {{ target_lights }}
    {% endif %}

sequence:
  # Always enable the daytime temperature and brightness booleans
  - service: input_boolean.turn_on
    target:
      entity_id:
        - "{{ use_daytime_temp }}"
        - "{{ use_daytime_brightness }}"

  # Turn on lights with appropriate settings
  - repeat:
      for_each: "{{ active_lights }}"
      sequence:
        - service: light.turn_on
          target:
            entity_id: "{{ repeat.item }}"
          data:
            color_temp_kelvin: "{{ states(daytime_kelvin) | int }}"
            brightness_pct: >
              {% if use_nightlights %}
                {{ nightlight_brightness | float }}
              {% else %}
                {{ brightness_overrides.get(repeat.item, states(room_brightness) | float(50)) | float }}
              {% endif %}
            transition: "{{ transition_time }}"
