blueprint:
  name: Daytime Lighting Controller
  description: Gradually change all lights in multiple rooms when daylight_kelvin changes, supporting temperature and brightness control per area
  domain: automation
  input:
    areas:
      name: Areas
      description: Select all areas for daytime lighting control
      selector:
        area:
          multiple: true
    transition_time:
      name: Transition Time
      description: Transition time in seconds
      default: 600
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: "s"

variables:
  transition_time: !input transition_time
  areas: !input areas
  socket_lights: "{{ label_entities('socket') | list }}"

triggers:
  - entity_id: input_number.daylight_kelvin
    trigger: state

conditions:
  - condition: template
    value_template: >-
      {% set ns = namespace(has_lights=false) %}
      {% for area in areas %}
        {% set use_temp_boolean = "input_boolean." ~ area | lower | replace(' ', '_') ~ "_use_daytime_temp" %}
        {% set use_brightness_boolean = "input_boolean." ~ area | lower | replace(' ', '_') ~ "_use_daytime_brightness" %}
        {% if is_state(use_temp_boolean, 'on') or is_state(use_brightness_boolean, 'on') %}
          {% set area_group = "light." ~ area | lower | replace(' ', '_') %}
          {% set all_lights = area_entities(area) | select('match', '^light\.') | list %}
          {% set without_group = all_lights | reject('eq', area_group) | list %}
          {% set filtered_lights = without_group | reject('in', socket_lights) | list %}
          {% set on_lights = expand(filtered_lights) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list %}
          {% if on_lights | count > 0 %}
            {% set ns.has_lights = true %}
          {% endif %}
        {% endif %}
      {% endfor %}
      {{ ns.has_lights }}

actions:
  - repeat:
      for_each: "{{ areas }}"
      sequence:
        - variables:
            current_area: "{{ repeat.item }}"
            area_group: "light.{{ current_area | lower | replace(' ', '_') }}"
            all_area_lights: >-
              {% set all_lights = area_entities(current_area) | select('match', '^light\.') | list %}
              {% set without_group = all_lights | reject('eq', area_group) | list %}
              {{ without_group | reject('in', socket_lights) | list }}
            area_lights: >-
              {{ expand(all_area_lights) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}
            use_temp_boolean: "input_boolean.{{ current_area | lower | replace(' ', '_') }}_use_daytime_temp"
            use_brightness_boolean: "input_boolean.{{ current_area | lower | replace(' ', '_') }}_use_daytime_brightness"
            brightness_input: "input_number.{{ current_area | lower | replace(' ', '_') }}_daytime_room_brightness"
            temp_enabled: "{{ states(use_temp_boolean) == 'on' }}"
            brightness_enabled: "{{ states(use_brightness_boolean) == 'on' }}"

        - condition: and
          conditions:
            - condition: template
              value_template: "{{ area_lights | count > 0 }}"
            - condition: or
              conditions:
                - condition: template
                  value_template: "{{ temp_enabled }}"
                - condition: template
                  value_template: "{{ brightness_enabled }}"

        # Scenario 1: Both temperature and brightness enabled
        - if:
            - condition: template
              value_template: "{{ temp_enabled and brightness_enabled }}"
          then:
            - target:
                entity_id: "{{ area_lights }}"
              data:
                color_temp_kelvin: "{{ states('input_number.daylight_kelvin') | int }}"
                brightness_pct: "{{ states(brightness_input) | int }}"
                transition: "{{ transition_time | int }}"
              action: light.turn_on
          else:
            # Scenario 2: Only temperature enabled
            - if:
                - condition: template
                  value_template: "{{ temp_enabled }}"
              then:
                - target:
                    entity_id: "{{ area_lights }}"
                  data:
                    color_temp_kelvin: "{{ states('input_number.daylight_kelvin') | int }}"
                    transition: "{{ transition_time | int }}"
                  action: light.turn_on
              # Scenario 3: Only brightness enabled
              else:
                - target:
                    entity_id: "{{ area_lights }}"
                  data:
                    brightness_pct: "{{ states(brightness_input) | int }}"
                    transition: "{{ transition_time | int }}"
                  action: light.turn_on

mode: restart
